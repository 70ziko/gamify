[project]
name = "gamify-api"
version = "0.1.0"
description = "Gamify API: roadmaps, progress, marketplace and AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31",
    "fastapi[standard]>=0.139.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.51",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.15",
    "sqlalchemy[asyncio]>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs the local Supabase Postgres"]
